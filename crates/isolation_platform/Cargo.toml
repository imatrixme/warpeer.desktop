[package]
name = "warp_isolation_platform"
description = "Utilities for running Warp within an isolated sandbox, such as a Docker container or Github Actions"
version = "0.1.0"
authors.workspace = true
publish.workspace = true
license.workspace = true
edition = "2024"

[features]
default = ["runtime"]
runtime = [
    "dep:base64",
    "dep:command",
    "dep:log",
    "dep:serde_json",
    "dep:warp_core",
]

[dependencies]
anyhow.workspace = true
base64 = { workspace = true, optional = true }
chrono.workspace = true
log = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
command = { workspace = true, optional = true }
warp_core = { workspace = true, optional = true }
