[package]
name = "warp_managed_secrets"
version = "0.1.0"
authors.workspace = true
publish.workspace = true
license.workspace = true
edition = "2024"

[features]
default = ["runtime"]
runtime = [
    "dep:base64",
    "dep:hpke",
    "dep:rand",
    "dep:tempfile",
    "dep:tink-core",
    "dep:tink-hybrid",
    "dep:tink-proto",
    "dep:tracing",
    "dep:warp_isolation_platform",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = { workspace = true, optional = true }
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tink-core = { version = "0.3", optional = true }
tink-proto = { version = "0.3", optional = true }
tink-hybrid = { version = "0.3", optional = true }
tracing = { workspace = true, optional = true }
warpui_core.workspace = true
warp_core.workspace = true
warp_graphql.workspace = true
vec1.workspace = true
warp_isolation_platform = { workspace = true, optional = true }

# Pure-Rust HPKE implementation (RFC 9180).
hpke = { version = "0.13", optional = true, default-features = false, features = ["alloc", "x25519"] }
# Pinned to 0.9 (not the workspace 0.8) to match hpke's rand_core 0.9 requirement.
rand = { version = "0.9", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tink-core = { version = "0.3", features = ["json", "insecure"] }
